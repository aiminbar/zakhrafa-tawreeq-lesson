<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقويم التجميعي</title><link rel="stylesheet" href="new.css"></head><body><header class="hero"><img src="general-header.png"><h1>⑪ التَّقْوِيمُ التَّجْمِيعِيُّ ⭐</h1></header><div class="bar"><a class="fab" href="index.html">🏠 الرئيسية</a><b>⭐ التَّقْوِيمُ</b></div><main class="wrap"><div class="stars" id="stars"></div><section class="card" id="box"></section></main><script src="common.js"></script><script>
let q=0;const qs=[
{t:'⭐ الْمَحَطَّةُ ① — أَخْتَارُ',p:'مَا الْمَقْصُودُ بِالتَّجْرِيدِ؟',o:['الِابْتِعَادُ عَنِ النَّقْلِ الْحَرْفِيِّ وَرَفْضُ الْمُحَاكَاةِ مِنْ عَنَاصِرِ الطَّبِيعَةِ.','نَقْلُ الْعُنْصُرِ كَمَا هُوَ تَمَامًا.','اسْتِخْدَامُ الْأَشْكَالِ الْهَنْدَسِيَّةِ فَقَطْ.'],a:0},
{t:'⭐ الْمَحَطَّةُ ② — أُشَاهِدُ وَأُمَيِّزُ',p:'أَيُّ شَكْلٍ يُمَثِّلُ وَحْدَةً زُخْرُفِيَّةً نَبَاتِيَّةً مُجَرَّدَةً؟',img:'formulations-1-2.png',o:['الشَّكْلُ الطَّبِيعِيُّ','الْوَحْدَةُ الزُّخْرُفِيَّةُ الْمُجَرَّدَةُ','شَكْلٌ هَنْدَسِيٌّ'],a:1},
{t:'⭐ الْمَحَطَّةُ ③ — أُرَتِّبُ',p:'رَتِّبِي الْخُطُوَاتِ حَتَّى نَصِلَ إِلَى وَحْدَةٍ زُخْرُفِيَّةٍ.',drag:true},
{t:'⭐ الْمَحَطَّةُ ④ — أَكْتَشِفُ',p:'أَيُّ التَّكْوِينَاتِ يُمَثِّلُ التَّوْرِيقَ فِي الزَّخْرَفَةِ؟ 🌿',img:'tawreeq-choice.png',o:['زَخْرَفَةٌ هَنْدَسِيَّةٌ','تَوْرِيقٌ نَبَاتِيٌّ','زَهْرَةٌ طَبِيعِيَّةٌ'],a:1},
{t:'⭐ الْمَحَطَّةُ ⑤ — أُكْمِلُ النَّمَطَ',p:'🌿 ◇ 🌿 ◇ 🌿 ❓',o:['◇ مُعَيَّن','🌿 وَحْدَةٌ نَبَاتِيَّةٌ','● دَائِرَة'],a:0},
{t:'⭐ الْمَحَطَّةُ ⑥ — أُطَبِّقُ',p:'أَيُّ تَكْوِينٍ اسْتَخْدَمَ الْوَحْدَةَ الزُّخْرُفِيَّةَ بِالتَّكْرَارِ؟',img:'repeat-1.png',o:['تَكْوِينٌ بِوَحْدَةٍ وَاحِدَةٍ','تَكْوِينٌ بِتَكْرَارِ الْوَحْدَةِ','رَسْمٌ طَبِيعِيٌّ'],a:1}];
function render(){stars.innerHTML=starsFn(q);let x=qs[q];if(!x){box.innerHTML='<h1>🏆 أَحْسَنْتِ يَا فَنَّانَةَ الزَّخْرَفَةِ!</h1><p class="lead">أَتْمَمْتِ رِحْلَتَكِ فِي تَجْرِيدِ الْوَحْدَةِ الزُّخْرُفِيَّةِ النَّبَاتِيَّةِ وَالتَّوْرِيقِ فِي الزَّخَارِفِ الْإِسْلَامِيَّةِ. 🌿✨</p><h2>نَتِيجَتُكِ: ٦ / ٦ ⭐</h2>';return}box.innerHTML=`<h2>${x.t}</h2><p class="lead">${x.p}</p>${x.img?`<img class="visual" src="${x.img}">`:''}<div id="area"></div><div class="feedback" id="fb"></div>`;if(x.drag)return dragQ();area.innerHTML='<div class="choices">'+x.o.map((o,i)=>`<button class="choice" onclick="answer(${i})">${o}</button>`).join('')+'</div>'}function starsFn(n){return Array.from({length:6},(_,i)=>`<span class="${i<n?'on':''}">★</span>`).join('')}function answer(i){let x=qs[q];if(i!==x.a)return say('fb','حَاوِلِي مَرَّةً أُخْرَى 🌱',false);say('fb','أَحْسَنْتِ! ⭐',true);q++;stars.innerHTML=starsFn(q);setTimeout(render,900)}
function dragQ(){const correct=['عُنْصُرٌ نَبَاتِيٌّ','تَبْسِيطٌ','تَحْوِيرٌ','وَحْدَةٌ زُخْرُفِيَّةٌ'];let arr=[...correct].sort(()=>Math.random()-.5),placed=[null,null,null,null],drag=null;area.innerHTML='<div class="dragzone" id="bank"></div><div class="slots" id="slots"></div><p><button class="btn" id="ck">أَتَحَقَّقُ ✨</button></p>';arr.forEach(v=>{let b=document.createElement('div');b.className='drag';b.textContent=v;b.dataset.v=v;b.draggable=true;b.ondragstart=()=>drag=b;b.onpointerdown=e=>{drag=b;b.setPointerCapture(e.pointerId)};b.onpointerup=e=>{let s=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');if(s)put(s,b)};bank.appendChild(b)});for(let i=0;i<4;i++){let s=document.createElement('div');s.className='slot';s.dataset.i=i;s.textContent=i+1;s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();put(s,drag)};slots.appendChild(s)}function put(s,b){let i=+s.dataset.i;if(placed[i])bank.appendChild(placed[i]);placed[i]=b;s.innerHTML='';s.appendChild(b)}ck.onclick=()=>{if(placed.every((b,i)=>b&&b.dataset.v===correct[i])){say('fb','أَحْسَنْتِ! ⭐',true);q++;stars.innerHTML=starsFn(q);setTimeout(render,900)}else say('fb','حَاوِلِي مَرَّةً أُخْرَى 🌱',false)}}render();
</script></body></html>
